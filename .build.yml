image: alpine/edge
packages:
  - golangci-lint
  - go
tasks:
  - build: |
      cd furgit
      go build
  - test-sha256: |
      cd furgit
      go test -v ./...
  - test-sha1: |
      cd furgit
      go test -v -tags sha1 ./...
  - test-race-sha256: |
      cd furgit
      go test -race -v ./...
  - test-race-sha1: |
      cd furgit
      go test -race -v -tags sha1 ./...
  - test-purego-sha256: |
      cd furgit
      go test -v -tags purego ./...
  - lint: |
      cd furgit
      golangci-lint run ./...
