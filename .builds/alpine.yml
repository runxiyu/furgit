image: alpine/edge
packages:
  - go
  - git
tasks:
  - install: |
      go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  - build: |
      cd furgit
      go build ./...
  - test: |
      cd furgit
      go test -v ./...
  - test-race: |
      cd furgit
      go test -race -v ./...
  - test-purego: |
      cd furgit
      go test -v -tags purego ./...
  - lint: |
      cd furgit
      "$(go env GOPATH)"/bin/golangci-lint run ./...
  - vet: |
      cd furgit
      go vet ./...
  - fmt-check: |
      cd furgit
      test -z "$(gofmt -l .)"
